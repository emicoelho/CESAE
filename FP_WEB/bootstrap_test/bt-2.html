<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <!--1. Transforma a section num bootstrap container.​

    2. Dá ao h1 texto branco, background preto e texto alinhado ao centro.​

    3. Tranforma a div num alerta amarelo. Coloca o atributo role como alert.​

    4. Transforma o primeiro botão num botão bootstrap verde.​

    5. Transforma o segundo botão num botão bootstrap vermelho.​

    6. Personaliza algo à tua escolha.​-->

    <div class="container">
        <div class="row my-3 p-3 mb-2 bg-dark text-center text-white">            
            <h1>Bad news</h1>             
        </div>    

        <div class="row my-3">
            <div class=" alert alert-warning" role="alert">                
                You are all going to die!
            </div>
        </div>
        
        <div class="d-flex my-3 align-items-start">
          <button type="button" class="btn btn-sm btn-success">
            Come to Terms With
          </button>   
        </div>

        <div class="d-flex my-3 ">
          <button type="button" class="btn btn-danger">
            Continue to Deny
          </button>
        </div>
    
    </div>
    
  </body>
</html>
