<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <!--Uma row com um bloco de 6 colunas em ecrã do pc com o vosso nome,
    que em ecras pequenos abranja 12 colunas. Cor de background: a vossa 
    preferida das cores bootstrap  (que não verde).
    
    Uma row com um bloco central que abranja 8 colunas com a seguinte 
    frase: "eu serei um génio da programação" ao centro da coluna, 
    background verde.​
    ​-->

    
    <div class="container text-center text-white ">
        <div class="row justify-content-center my-3">
            <div class="col-6 p-3 mb-2 bg-primary">    
                Emily
            </div>
        </div>
        
        <div class="row justify-content-center my-3">
            <div class=" p-3 mb-2 bg-success col-12">
            Eu fui um (wannabe) gênio da programação!
        </div>
    </div>     
  </body>
</html>
