<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <div>
        <form>
            <label for="fnome">Nome:</label>
            <input type="text" id="fnome" nome="fnome"><br>
            <label for="femail">Email:</label>
            <input type="text" id="femail" email="femail"><br><br>

            <input type="radio" id="masculino" name="male" value="Masculino">
            <label for="masculino">Masculino</label><br>
            <input type="radio" id="feminino" name="female" value="Feminino">
            <label for="feminino">Feminino</label>
        </form>
    </div>
</body>
</html>
